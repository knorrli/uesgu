# Weekly dependency update PRs. Security advisories are also opened automatically
# regardless of schedule. Kept low-noise: minor/patch bumps arrive as one grouped PR,
# major bumps as another.
version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ruby-minor-and-patch:
        update-types: [minor, patch]
      ruby-major:
        update-types: [major]
    ignore:
      # cuprite 0.18 / ferrum 0.18 make the account-form field-height system test
      # fail intermittently on CI's Linux Chrome (the <select> measures 31px against
      # 36px) while every other gem in the group passes. REMOVE THIS once the test
      # passes reliably on 0.18.
      - dependency-name: cuprite
        versions: [">= 0.18"]
      - dependency-name: ferrum
        versions: [">= 0.18"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
