  about:
    title: À propos de üsgu
    heading: À propos de üsgu
    intro: üsgu.ch te montre les grands événements musicaux de Suisse, mais surtout les plus petits ou les plus cachés, sans te noyer sous la pub ni te piquer tes données. Pour l'instant l'accent régional est mis sur Berne et ses environs, et il s'élargit petit à petit.
    why:
      title: Pourquoi üsgu existe ?
      body: J'ai créé üsgu parce qu'aucune plateforme suisse ne liste aussi les gigs d'arrière-cour, et parce que je n'ai aucune envie de Facebook, Instagram ou ce genre de choses. Les approches comme hinto.net, BKA ou RonOrp ne remplissent pas ce rôle, à mon avis, parce qu'elles attendent que les données des événements soient préparées et/ou saisies.
    account:
      title: Faut-il un compte ?
      body: Non, üsgu marche sans compte obligatoire. Un compte te donne juste des fonctions en plus, comme ta liste à voir avec export vers ton calendrier, ou des filtres avec notifications. Pendant la phase de test, les comptes se donnent uniquement sur invitation, écris-moi un mail si ça t'intéresse.
    how:
      title: Comment fonctionne üsgu ?
      body: Comme les données ne viennent pas à nous, nous allons chercher nous-mêmes les informations accessibles publiquement. Cela se fait en grande partie automatiquement, mais aussi manuellement.
      crawler:
        title: Crawlers automatiques
        body: Les salles de concert qui ont un site public sont répertoriées dans une liste. Les sites sont lus une fois par nuit, les nouveaux événements sont enregistrés et les connus mis à jour.
      capture:
        title: Ajouts par la communauté
        body: "Si tu as un compte, tu peux saisir tes propres événements. Ça se fait soit à la main, soit en laissant l'IA lire une affiche, un flyer ou une description. Ces événements sont marqués « Communauté ». C'est comme ça que je saisis en ce moment les petits événements qu'on ne trouve sur aucun site public."
    contact:
      title: Contact
      body: Si tu as des questions ou si tu veux une salle dans la liste, écris à %{email}
      email: kontakt@uesgu.ch
  privacy:
    title: Confidentialité
    heading: Confidentialité
    intro: üsgu.ch est un projet privé et non commercial, et collecte le moins de données possible. Voici ce qui est enregistré, et pourquoi.
    collect_heading: Ce que nous enregistrons si tu as un compte
    collect_account: Ton nom d'utilisateur et ton mot de passe (chiffré), pour que tu puisses te connecter.
    collect_email: Ton adresse e-mail, si tu veux des notifications par e-mail.
    collect_content: Tes filtres enregistrés et tes événements gardés.
    collect_cookies: 'Trois cookies : l''un te maintient en session, un autre retient ton thème (clair/sombre), le dernier retient le filtre que tu as appliqué en dernier.'
    services_heading: Services externes
    services_hosting: 'Hébergement : Render (render.com), région de Francfort. Tes données restent dans l''UE.'
    services_email: 'E-mail : Resend (resend.com), région d''Irlande. Envoie les e-mails de notification optionnels.'
    services_push: 'Push : si tu actives les notifications push, elles passent par le service push de ton navigateur ou de ton téléphone (Google, Mozilla ou Apple).'
    calendar_heading: Lien calendrier
    calendar_body: Si tu crées un abonnement calendrier, son lien contient une clé secrète. Si tu partages ce lien, d'autres personnes peuvent voir tes événements gardés. Tu peux désactiver le lien calendrier à tout moment dans les réglages.
    logs_heading: Journaux serveur
    logs_body: Le serveur garde des journaux de courte durée qui contiennent ton adresse IP, comme tout site web. Ils servent en cas d'erreur ou d'abus, et on ne s'en sert pas pour te pister ou te profiler.
    nothing_heading: Ce que nous ne faisons pas
    nothing_body: Aucun pistage, aucun outil de statistique, aucune pub. Nous ne vendons pas tes données et ne les partageons pas.
    delete_heading: Suppression
    delete_body: Tu peux supprimer ton compte à tout moment dans les réglages, et tout ce qui te concerne disparaît avec.
    contact_heading: Contact
    contact_body: Des questions sur la confidentialité ? Écris à %{email}.
